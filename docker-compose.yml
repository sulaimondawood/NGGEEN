services:
  nggeen-db:
    container_name: nggeen-db
    image: postgres:14.20
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: nggeen-db
    volumes:
      - nggeen-volume:/var/lib/postgresql/data

  redis:
    container_name: redis
    image: redis:8.8.0
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - nggeen-redis-data:/data

volumes:
  nggeen-volume:
  nggeen-redis-data:

